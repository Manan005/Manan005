  <text x="20" y="67" font-family="ui-monospace, monospace" font-size="13" opacity="0" style="animation: fadeRow 300ms 0ms both;"><tspan fill="#7d8590">Identity: </tspan><tspan fill="#e6edf3">Adaptable Full-Stack Engineer</tspan></text>
