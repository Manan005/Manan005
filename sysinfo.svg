  <rect x="520" y="110" width="8" height="15" fill="#a5d8ff" opacity="0" style="animation: blink 1s 660ms 3;"></rect>
  <text x="20" y="151" font-family="ui-monospace, monospace" font-size="13" opacity="0" style="animation: fadeRow 300ms 540ms both;"><tspan fill="#7d8590">Mission: </tspan><tspan fill="#e6edf3">Demystifying AI literacy &amp; developer tools</tspan></text>
